name: Portfolio security

on:
  pull_request:
  push:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secrets and filesystem vulnerabilities
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned scanners
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/bin"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 300 --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 300 --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          chmod 0755 "$RUNNER_TEMP/bin/gitleaks" "$RUNNER_TEMP/bin/trivy"
          printf '%s\n' "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Secret history gate
        run: gitleaks git --redact --no-banner

      - name: Dependency, configuration and secret gate
        if: ${{ always() }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: >-
          trivy fs --exit-code 1 --severity HIGH,CRITICAL
          --scanners vuln,misconfig,secret --ignore-unfixed .
